<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKasira" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2418"/>
      <stop offset="100%" stop-color="#050F0A"/>
    </linearGradient>
    <linearGradient id="btnKasira" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgKasira)"/>

  <!-- App Shell -->
  <rect x="40" y="30" width="720" height="540" rx="16" fill="#0D1F15" stroke="#1B3828" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="44" rx="16" fill="#0A1810"/>
  <circle cx="68" cy="52" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="86" cy="52" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="104" cy="52" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="56" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Kasira — Point of Sale &amp; UMKM Management</text>

  <g transform="translate(68, 96)">
    <!-- Left: Product Catalog Grid -->
    <g transform="translate(0, 0)">
      <!-- Search bar -->
      <rect x="0" y="0" width="410" height="40" rx="8" fill="#132B1E" stroke="#1F4631" stroke-width="1"/>
      <text x="16" y="25" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="12">Cari produk: kopi, pastry, snack...</text>
      
      <!-- Category Tabs -->
      <rect x="0" y="50" width="80" height="26" rx="13" fill="#10B981"/>
      <text x="40" y="67" fill="#064E3B" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Semua</text>
      <rect x="90" y="50" width="80" height="26" rx="13" fill="#143021"/>
      <text x="130" y="67" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Minuman</text>
      <rect x="180" y="50" width="80" height="26" rx="13" fill="#143021"/>
      <text x="220" y="67" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Makanan</text>
      <rect x="270" y="50" width="80" height="26" rx="13" fill="#143021"/>
      <text x="310" y="67" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Snack</text>

      <!-- 4 Product Cards Grid -->
      <g transform="translate(0, 88)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="195" height="150" rx="10" fill="#142C1E" stroke="#1D402C" stroke-width="1"/>
        <rect x="12" y="12" width="171" height="74" rx="6" fill="#1B3A28"/>
        <circle cx="97" cy="49" r="20" fill="#10B981" fill-opacity="0.25"/>
        <text x="97" y="55" fill="#34D399" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">☕</text>
        <text x="14" y="108" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Kopi Susu Gula Aren</text>
        <text x="14" y="132" fill="#34D399" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Rp 18.000</text>
        <rect x="155" y="114" width="26" height="26" rx="6" fill="#10B981"/>
        <text x="168" y="131" fill="#064E3B" font-family="'Inter', sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>

        <!-- Card 2 -->
        <rect x="215" y="0" width="195" height="150" rx="10" fill="#142C1E" stroke="#1D402C" stroke-width="1"/>
        <rect x="227" y="12" width="171" height="74" rx="6" fill="#1B3A28"/>
        <circle cx="312" cy="49" r="20" fill="#10B981" fill-opacity="0.25"/>
        <text x="312" y="55" fill="#34D399" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🥐</text>
        <text x="229" y="108" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Croissant Butter</text>
        <text x="229" y="132" fill="#34D399" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Rp 22.000</text>
        <rect x="370" y="114" width="26" height="26" rx="6" fill="#10B981"/>
        <text x="383" y="131" fill="#064E3B" font-family="'Inter', sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>

        <!-- Card 3 -->
        <rect x="0" y="162" width="195" height="150" rx="10" fill="#142C1E" stroke="#1D402C" stroke-width="1"/>
        <rect x="12" y="174" width="171" height="74" rx="6" fill="#1B3A28"/>
        <circle cx="97" cy="211" r="20" fill="#10B981" fill-opacity="0.25"/>
        <text x="97" y="217" fill="#34D399" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🍵</text>
        <text x="14" y="270" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Matcha Latte Ice</text>
        <text x="14" y="294" fill="#34D399" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Rp 24.000</text>
        <rect x="155" y="276" width="26" height="26" rx="6" fill="#10B981"/>
        <text x="168" y="293" fill="#064E3B" font-family="'Inter', sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>

        <!-- Card 4 -->
        <rect x="215" y="162" width="195" height="150" rx="10" fill="#142C1E" stroke="#1D402C" stroke-width="1"/>
        <rect x="227" y="174" width="171" height="74" rx="6" fill="#1B3A28"/>
        <circle cx="312" cy="211" r="20" fill="#10B981" fill-opacity="0.25"/>
        <text x="312" y="217" fill="#34D399" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🥪</text>
        <text x="229" y="270" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Roti Bakar Keju</text>
        <text x="229" y="294" fill="#34D399" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Rp 16.000</text>
        <rect x="370" y="276" width="26" height="26" rx="6" fill="#10B981"/>
        <text x="383" y="293" fill="#064E3B" font-family="'Inter', sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>
      </g>
    </g>

    <!-- Right: Active Bill / Cart Sidebar -->
    <g transform="translate(434, 0)">
      <rect x="0" y="0" width="230" height="400" rx="12" fill="#102519" stroke="#1A3B28" stroke-width="1.5"/>
      <text x="18" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Pesanan Aktif #048</text>
      <text x="18" y="50" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="11">Meja 04 • Pelanggan: Rian</text>

      <!-- Cart Items -->
      <line x1="18" y1="64" x2="212" y2="64" stroke="#1E442F"/>
      
      <g transform="translate(18, 76)">
        <text x="0" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">2x Kopi Susu Aren</text>
        <text x="194" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="end">36.000</text>
      </g>
      <g transform="translate(18, 106)">
        <text x="0" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">1x Croissant Butter</text>
        <text x="194" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="end">22.000</text>
      </g>
      <g transform="translate(18, 136)">
        <text x="0" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">1x Roti Bakar Keju</text>
        <text x="194" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="end">16.000</text>
      </g>

      <line x1="18" y1="260" x2="212" y2="260" stroke="#1E442F"/>

      <!-- Totals -->
      <text x="18" y="284" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12">Subtotal</text>
      <text x="212" y="284" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">Rp 74.000</text>

      <text x="18" y="306" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12">Pajak (PB1 10%)</text>
      <text x="212" y="306" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">Rp 7.400</text>

      <text x="18" y="334" fill="#34D399" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Total Bayar</text>
      <text x="212" y="334" fill="#34D399" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="end">Rp 81.400</text>

      <!-- Pay Button -->
      <rect x="18" y="350" width="194" height="38" rx="8" fill="url(#btnKasira)"/>
      <text x="115" y="374" fill="#042F1E" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Bayar (QRIS / Tunai)</text>
    </g>
  </g>
</svg>
