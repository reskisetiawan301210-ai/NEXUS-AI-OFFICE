<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1820"/>
      <stop offset="60%" stop-color="#0E0D12"/>
      <stop offset="100%" stop-color="#050406" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2838"/>
      <stop offset="50%" stop-color="#16131D"/>
      <stop offset="100%" stop-color="#08070A"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Head Glow behind -->
  <circle cx="300" cy="270" r="180" fill="#FF6B1A" fill-opacity="0.14" filter="blur(50px)"/>

  <!-- Neck & Shoulders -->
  <path d="M120 780 C130 620, 200 520, 240 450 L360 450 C400 520, 470 620, 480 780 Z" fill="url(#bodyGrad)"/>

  <!-- High-collar suit lines -->
  <path d="M230 450 L270 540 L300 620 L330 540 L370 450" fill="none" stroke="#2D2A38" stroke-width="2.5"/>
  <path d="M300 520 L300 780" stroke="#FF6B1A" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Head / Helmet Silhouette -->
  <ellipse cx="300" cy="270" rx="140" ry="170" fill="url(#helmetGrad)" stroke="#3E384D" stroke-width="2"/>

  <!-- Cybernetic Headphones Ring (Zywra signature style) -->
  <g transform="translate(300, 270)">
    <!-- Left headphone ring -->
    <ellipse cx="-135" cy="10" rx="22" ry="55" fill="#131118" stroke="#FF6B1A" stroke-width="4" filter="url(#softGlow)"/>
    <ellipse cx="-135" cy="10" rx="10" ry="32" fill="#FF8C42" fill-opacity="0.3"/>

    <!-- Right headphone ring -->
    <ellipse cx="135" cy="10" rx="22" ry="55" fill="#131118" stroke="#FF6B1A" stroke-width="4" filter="url(#softGlow)"/>
    <ellipse cx="135" cy="10" rx="10" ry="32" fill="#FF8C42" fill-opacity="0.3"/>
  </g>

  <!-- Sleek Cyber Visor -->
  <path d="M190 240 Q 300 270, 410 240 Q 420 295, 395 320 Q 300 350, 205 320 Q 180 295, 190 240 Z" fill="#0A080E" stroke="#FF8C42" stroke-width="1.5"/>
  <path d="M205 265 Q 300 295, 395 265" fill="none" stroke="url(#visorGrad)" stroke-width="4" filter="url(#softGlow)"/>

  <!-- Subtle face/chin contour -->
  <path d="M235 340 Q 300 410, 365 340" fill="none" stroke="#332E40" stroke-width="2"/>

  <!-- Subtle specular highlight on helmet top -->
  <path d="M210 160 Q 300 110, 390 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>
</svg>
