      <g transform="translate(0, 226)">
        <rect x="0" y="0" width="226" height="150" rx="12" fill="#1A1108" stroke="#332110" stroke-width="1.5"/>
        <rect x="12" y="12" width="202" height="80" rx="8" fill="#2E1D0E"/>
        <text x="113" y="56" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Luminary Studio</text>
        <text x="16" y="112" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Fashion Brand Launch</text>
        <text x="16" y="130" fill="#A8A29E" font-family="'Inter', sans-serif" font-size="11">Next.js • GSAP • Shopify</text>

        <rect x="246" y="0" width="226" height="150" rx="12" fill="#1A1108" stroke="#332110" stroke-width="1.5"/>
        <rect x="258" y="12" width="202" height="80" rx="8" fill="#2E1D0E"/>
        <text x="359" y="56" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hyperion AI</text>
