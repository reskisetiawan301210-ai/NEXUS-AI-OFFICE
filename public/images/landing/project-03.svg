<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1408"/>
      <stop offset="50%" stop-color="#120B04"/>
      <stop offset="100%" stop-color="#080502"/>
    </linearGradient>
    <linearGradient id="p3Orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#EA580C"/>
