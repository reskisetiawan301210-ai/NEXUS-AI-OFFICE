      <text x="24" y="112" fill="url(#goldText)" font-family="'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Built For Ambitious Brands.</text>
      <text x="24" y="142" fill="#D6D3D1" font-family="'Inter', sans-serif" font-size="13">Desain editorial, performa kilat, dan conversion rate kelas dunia.</text>

