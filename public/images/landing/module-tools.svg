<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1408"/>
      <stop offset="100%" stop-color="#0F0A04"/>
    </linearGradient>
    <linearGradient id="orangeTool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgTools)"/>

  <!-- App Shell -->
  <rect x="40" y="30" width="720" height="540" rx="16" fill="#17110A" stroke="#332414" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="44" rx="16" fill="#120D07"/>
  <circle cx="68" cy="52" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="86" cy="52" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="104" cy="52" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="56" fill="#D97706" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">NEXUS Utilities — Everyday Productivity Toolkit</text>

  <g transform="translate(68, 96)">
    <!-- Widget 1: QR Generator Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="315" height="195" rx="12" fill="#20170E" stroke="#3D2916" stroke-width="1.5"/>
      <text x="20" y="32" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="14" font-weight="700">✦ Instant QR Generator</text>
      
      <!-- QR code mockup -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="110" height="110" rx="8" fill="#FFFFFF"/>
        <!-- QR Patterns -->
        <rect x="10" y="10" width="30" height="30" fill="#000000"/>
        <rect x="16" y="16" width="18" height="18" fill="#FFFFFF"/>
        <rect x="20" y="20" width="10" height="10" fill="#000000"/>

        <rect x="70" y="10" width="30" height="30" fill="#000000"/>
        <rect x="76" y="16" width="18" height="18" fill="#FFFFFF"/>
        <rect x="80" y="20" width="10" height="10" fill="#000000"/>

        <rect x="10" y="70" width="30" height="30" fill="#000000"/>
        <rect x="16" y="76" width="18" height="18" fill="#FFFFFF"/>
        <rect x="20" y="80" width="10" height="10" fill="#000000"/>

        <rect x="46" y="20" width="16" height="16" fill="#FF6B1A"/>
        <rect x="52" y="46" width="22" height="22" fill="#000000"/>
        <rect x="78" y="52" width="18" height="18" fill="#000000"/>
        <rect x="46" y="78" width="48" height="18" fill="#000000"/>
      </g>

      <g transform="translate(145, 52)">
        <text x="0" y="16" fill="#FED7AA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Scan &amp; Share URL</text>
        <text x="0" y="34" fill="#A8A29E" font-family="'Inter', sans-serif" font-size="11">Resolusi HD, siap unduh SVG / PNG transparan.</text>
        <rect x="0" y="72" width="145" height="34" rx="6" fill="url(#orangeTool)"/>
        <text x="72" y="93" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Unduh QR Code</text>
      </g>
    </g>

    <!-- Widget 2: Calorie & Health Tracker -->
    <g transform="translate(345, 0)">
      <rect x="0" y="0" width="315" height="195" rx="12" fill="#20170E" stroke="#3D2916" stroke-width="1.5"/>
      <text x="20" y="32" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="14" font-weight="700">⚡ Daily Calorie Calculator</text>

      <g transform="translate(20, 50)">
        <circle cx="50" cy="55" r="42" fill="none" stroke="#382819" stroke-width="8"/>
        <circle cx="50" cy="55" r="42" fill="none" stroke="#FF8C42" stroke-width="8" stroke-dasharray="210" stroke-dashoffset="65" stroke-linecap="round"/>
        <text x="50" y="55" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="800" text-anchor="middle">1,840</text>
        <text x="50" y="70" fill="#A8A29E" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">kkal / 2,200</text>

        <g transform="translate(115, 12)">
          <text x="0" y="14" fill="#FED7AA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Makro Nutrisi</text>
          <text x="0" y="36" fill="#A8A29E" font-family="'Inter', sans-serif" font-size="11">Protein: 140g (82%)</text>
          <text x="0" y="54" fill="#A8A29E" font-family="'Inter', sans-serif" font-size="11">Karbo: 195g (70%)</text>
          <text x="0" y="72" fill="#A8A29E" font-family="'Inter', sans-serif" font-size="11">Lemak: 52g (65%)</text>
        </g>
      </g>
    </g>

    <!-- Widget 3: Quick Markdown Notes & Unit Converter (Bottom row) -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="660" height="185" rx="12" fill="#1C140C" stroke="#332212" stroke-width="1.5"/>
      
      <!-- Left side: Markdown scratchpad -->
      <g transform="translate(24, 20)">
        <text x="0" y="14" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="14" font-weight="700">📝 Fast Scratchpad (Markdown Sync)</text>
        <rect x="0" y="28" width="360" height="110" rx="8" fill="#140E08" stroke="#2B1C10" stroke-width="1"/>
        <text x="14" y="52" fill="#38BDF8" font-family="'Courier New', monospace" font-size="12"># Target Sprint Minggu Ini</text>
        <text x="14" y="72" fill="#4ADE80" font-family="'Courier New', monospace" font-size="12">- [x] Deploy Kasira POS Update v2.4</text>
        <text x="14" y="92" fill="#FCD34D" font-family="'Courier New', monospace" font-size="12">- [/] Testing NEXUS Audio Engine</text>
        <text x="14" y="112" fill="#94A3B8" font-family="'Courier New', monospace" font-size="12">- [ ] Siapkan Materi Showcase AURA</text>
      </g>

      <!-- Right side: Quick Converter -->
      <g transform="translate(415, 20)">
        <text x="0" y="14" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="14" font-weight="700">🔄 Quick Unit Converter</text>
        <rect x="0" y="28" width="220" height="42" rx="8" fill="#140E08" stroke="#2B1C10" stroke-width="1"/>
        <text x="14" y="54" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">1,500 USD</text>
        
        <rect x="0" y="80" width="220" height="42" rx="8" fill="#24160A" stroke="#FF6B1A" stroke-width="1"/>
        <text x="14" y="106" fill="#FF8C42" font-family="'Inter', sans-serif" font-size="14" font-weight="700">≈ Rp 24.350.000</text>
      </g>
    </g>
  </g>
</svg>
