        <text x="20" y="30" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">GRAFIK TRANSAKSI JAM SIBUK</text>
        
        <!-- Smooth bezier curve for sales graph -->
        <path d="M30 115 Q 100 95, 150 110 T 260 70 T 360 40 T 440 60" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
        <circle cx="360" cy="40" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
        <text x="360" y="28" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Puncak (14:00)</text>

