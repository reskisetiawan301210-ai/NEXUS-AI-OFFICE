        <text x="30" y="136" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="10">09:00</text>
        <text x="140" y="136" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="10">12:00</text>
        <text x="250" y="136" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="10">15:00</text>
        <text x="360" y="136" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="10">18:00</text>
        <text x="440" y="136" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="10">21:00</text>
