        <rect x="0" y="144" width="472" height="48" rx="8" fill="#0D2418" stroke="#183D28" stroke-width="1"/>
        <text x="16" y="172" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">#TRX-0980 • 2x Matcha Latte Ice</text>
