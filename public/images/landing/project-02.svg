<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071E13"/>
      <stop offset="50%" stop-color="#04120B"/>
      <stop offset="100%" stop-color="#020805"/>
