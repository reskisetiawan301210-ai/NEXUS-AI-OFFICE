  <rect width="600" height="750" fill="url(#p2Bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="300" cy="300" r="240" fill="#10B981" fill-opacity="0.10" filter="blur(40px)"/>

  <g transform="translate(40, 60)">
