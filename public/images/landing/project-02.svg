    <circle cx="28" cy="26" r="5" fill="#EF4444"/>
    <circle cx="44" cy="26" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="26" r="5" fill="#10B981"/>
    
    <text x="260" y="31" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">kasira-pos.id / kasir-utama</text>

    <!-- Kasira Dashboard Mock -->
    <g transform="translate(24, 76)">
