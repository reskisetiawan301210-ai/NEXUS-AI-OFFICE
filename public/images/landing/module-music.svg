<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMusic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A1E"/>
      <stop offset="100%" stop-color="#08050D"/>
    </linearGradient>
    <linearGradient id="albumArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgMusic)"/>

  <!-- App Shell -->
  <rect x="40" y="30" width="720" height="540" rx="16" fill="#13101C" stroke="#2D2342" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="44" rx="16" fill="#0F0C18"/>
  <circle cx="68" cy="52" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="86" cy="52" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="104" cy="52" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="56" fill="#9C8EB9" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">NEXUS Music — High Fidelity Audio Player</text>

  <!-- Player Main Layout -->
  <g transform="translate(68, 96)">
    <!-- Big Album Artwork -->
    <rect x="0" y="10" width="260" height="260" rx="16" fill="url(#albumArt)" stroke="#4A3468" stroke-width="1.5"/>
    <circle cx="130" cy="140" r="48" fill="#000000" fill-opacity="0.35"/>
    <circle cx="130" cy="140" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
    
    <!-- Song details & controls -->
    <g transform="translate(290, 20)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="#FF6B1A" fill-opacity="0.18"/>
      <text x="38" y="15" fill="#FF8C42" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">NOW PLAYING</text>
      
      <text x="0" y="52" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="700">Midnight Horizon (Lo-Fi)</text>
      <text x="0" y="76" fill="#A59BBF" font-family="'Inter', sans-serif" font-size="14">Aura Soundscapes &amp; Reski • Album Vol. 3</text>

      <!-- Audio visualizer waveform bars -->
      <g transform="translate(0, 105)" fill="url(#barGrad)">
        <rect x="0" y="24" width="6" height="36" rx="3"/>
        <rect x="12" y="12" width="6" height="48" rx="3"/>
        <rect x="24" y="4" width="6" height="56" rx="3"/>
        <rect x="36" y="28" width="6" height="32" rx="3"/>
        <rect x="48" y="8" width="6" height="52" rx="3"/>
        <rect x="60" y="0" width="6" height="60" rx="3"/>
        <rect x="72" y="16" width="6" height="44" rx="3"/>
        <rect x="84" y="32" width="6" height="28" rx="3"/>
        <rect x="96" y="10" width="6" height="50" rx="3"/>
        <rect x="108" y="2" width="6" height="58" rx="3"/>
        <rect x="120" y="20" width="6" height="40" rx="3"/>
        <rect x="132" y="36" width="6" height="24" rx="3"/>
        <rect x="144" y="14" width="6" height="46" rx="3"/>
        <rect x="156" y="6" width="6" height="54" rx="3"/>
        <rect x="168" y="26" width="6" height="34" rx="3"/>
        <rect x="180" y="18" width="6" height="42" rx="3"/>
        <rect x="192" y="8" width="6" height="52" rx="3"/>
        <rect x="204" y="0" width="6" height="60" rx="3"/>
        <rect x="216" y="22" width="6" height="38" rx="3"/>
        <rect x="228" y="38" width="6" height="22" rx="3"/>
        <rect x="240" y="12" width="6" height="48" rx="3"/>
        <rect x="252" y="4" width="6" height="56" rx="3"/>
        <rect x="264" y="24" width="6" height="36" rx="3"/>
        <rect x="276" y="30" width="6" height="30" rx="3"/>
        <rect x="288" y="16" width="6" height="44" rx="3"/>
        <rect x="300" y="8" width="6" height="52" rx="3"/>
        <rect x="312" y="20" width="6" height="40" rx="3"/>
        <rect x="324" y="34" width="6" height="26" rx="3"/>
        <rect x="336" y="14" width="6" height="46" rx="3"/>
        <rect x="348" y="28" width="6" height="32" rx="3"/>
        <rect x="360" y="38" width="6" height="22" rx="3"/>
      </g>

      <!-- Scrubber progress line -->
      <g transform="translate(0, 185)">
        <rect x="0" y="0" width="370" height="4" rx="2" fill="#2E2344"/>
        <rect x="0" y="0" width="220" height="4" rx="2" fill="#FF6B1A"/>
        <circle cx="220" cy="2" r="6" fill="#FFFFFF"/>
        <text x="0" y="20" fill="#7E729C" font-family="'Inter', sans-serif" font-size="11">02:44</text>
        <text x="370" y="20" fill="#7E729C" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">04:12</text>
      </g>

      <!-- Player playback controls -->
      <g transform="translate(130, 218)">
        <!-- Prev -->
        <circle cx="0" cy="18" r="16" fill="#251D36"/>
        <path d="M-4 12 L-4 24 M4 12 L-2 18 L4 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <!-- Play / Pause -->
        <circle cx="50" cy="18" r="22" fill="#FF6B1A"/>
        <rect x="44" y="11" width="4" height="14" rx="1.5" fill="#FFFFFF"/>
        <rect x="52" y="11" width="4" height="14" rx="1.5" fill="#FFFFFF"/>
        <!-- Next -->
        <circle cx="100" cy="18" r="16" fill="#251D36"/>
        <path d="M104 12 L104 24 M96 12 L102 18 L96 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Playlist Track List at bottom -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="664" height="48" rx="8" fill="#1C162B" stroke="#2B2140" stroke-width="1"/>
      <text x="20" y="29" fill="#FF8C42" font-family="'Inter', sans-serif" font-size="12" font-weight="700">01</text>
      <text x="50" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Midnight Horizon (Lo-Fi)</text>
      <text x="340" y="29" fill="#887B9F" font-family="'Inter', sans-serif" font-size="12">Aura Soundscapes</text>
      <text x="640" y="29" fill="#FF8C42" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">Playing</text>

      <rect x="0" y="56" width="664" height="48" rx="8" fill="#161224" stroke="#241B36" stroke-width="1"/>
      <text x="20" y="85" fill="#71658C" font-family="'Inter', sans-serif" font-size="12" font-weight="700">02</text>
      <text x="50" y="85" fill="#D3CCE4" font-family="'Inter', sans-serif" font-size="13">Digital Rain &amp; Deep Focus</text>
      <text x="340" y="85" fill="#71658C" font-family="'Inter', sans-serif" font-size="12">NEXUS Beats</text>
      <text x="640" y="85" fill="#71658C" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">03:52</text>

      <rect x="0" y="112" width="664" height="48" rx="8" fill="#161224" stroke="#241B36" stroke-width="1"/>
      <text x="20" y="141" fill="#71658C" font-family="'Inter', sans-serif" font-size="12" font-weight="700">03</text>
      <text x="50" y="141" fill="#D3CCE4" font-family="'Inter', sans-serif" font-size="13">Future Sunrise (Synthwave)</text>
      <text x="340" y="141" fill="#71658C" font-family="'Inter', sans-serif" font-size="12">Cyberwave Studio</text>
      <text x="640" y="141" fill="#71658C" font-family="'Inter', sans-serif" font-size="12" text-anchor="end">04:20</text>
    </g>
  </g>
</svg>
