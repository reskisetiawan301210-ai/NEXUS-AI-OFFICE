<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F17"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C28"/>
      <stop offset="100%" stop-color="#12131C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#E8420D"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Top App Window Bar -->
  <rect x="40" y="30" width="720" height="540" rx="16" fill="url(#cardGrad)" stroke="#262838" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="44" rx="16" fill="#141520"/>
  <circle cx="68" cy="52" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="86" cy="52" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="104" cy="52" r="5" fill="#10B981" opacity="0.8"/>
  
  <text x="400" y="56" fill="#8E92A8" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">NEXUS AI — Intelligent Workspace</text>

  <!-- Left Sidebar Mock -->
  <rect x="56" y="90" width="160" height="460" rx="10" fill="#11121B" stroke="#222434" stroke-width="1"/>
  <rect x="72" y="110" width="128" height="28" rx="6" fill="url(#accent)" opacity="0.15"/>
  <text x="86" y="128" fill="#FF8C42" font-family="'Inter', sans-serif" font-size="11" font-weight="700">✦ AI Assistant</text>
  
  <rect x="72" y="150" width="128" height="24" rx="6" fill="#1A1C28" opacity="0.6"/>
  <text x="86" y="166" fill="#7E8299" font-family="'Inter', sans-serif" font-size="11">Dashboard</text>
  <rect x="72" y="184" width="128" height="24" rx="6" fill="#1A1C28" opacity="0.6"/>
  <text x="86" y="200" fill="#7E8299" font-family="'Inter', sans-serif" font-size="11">Notes &amp; Focus</text>
  <rect x="72" y="218" width="128" height="24" rx="6" fill="#1A1C28" opacity="0.6"/>
  <text x="86" y="234" fill="#7E8299" font-family="'Inter', sans-serif" font-size="11">Workspaces</text>

  <!-- Main Chat / Workspace Stage -->
  <g transform="translate(236, 90)">
    <!-- User prompt card -->
    <rect x="180" y="20" width="324" height="48" rx="12" fill="#202232" stroke="#2D3046" stroke-width="1"/>
    <text x="200" y="50" fill="#E2E4F0" font-family="'Inter', sans-serif" font-size="12">Ringkas agenda kerja dan performa hari ini</text>

    <!-- AI Response Card -->
    <rect x="0" y="86" width="504" height="220" rx="14" fill="#161724" stroke="#2B2D40" stroke-width="1"/>
    <circle cx="28" cy="114" r="14" fill="url(#accent)"/>
    <text x="28" y="118" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">N</text>
    <text x="52" y="118" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">NEXUS AI</text>
    <rect x="120" y="108" width="46" height="18" rx="9" fill="#10B981" fill-opacity="0.15"/>
    <text x="143" y="121" fill="#10B981" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>

    <!-- Response text lines -->
    <text x="28" y="152" fill="#C4C7D8" font-family="'Inter', sans-serif" font-size="12">Tentu! Berikut ringkasan produktivitas dan alur workspace Anda:</text>
    
    <!-- Mini KPI cards in response -->
    <g transform="translate(28, 172)">
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#202234" stroke="#2F324C" stroke-width="1"/>
      <text x="14" y="24" fill="#8E92A8" font-family="'Inter', sans-serif" font-size="10">TUGAS SELESAI</text>
      <text x="14" y="48" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700">12 / 14</text>
      
      <rect x="154" y="0" width="140" height="60" rx="8" fill="#202234" stroke="#2F324C" stroke-width="1"/>
      <text x="168" y="24" fill="#8E92A8" font-family="'Inter', sans-serif" font-size="10">FOCUS TIME</text>
      <text x="168" y="48" fill="#FF8C42" font-family="'Inter', sans-serif" font-size="18" font-weight="700">4j 25m</text>

      <rect x="308" y="0" width="140" height="60" rx="8" fill="#202234" stroke="#2F324C" stroke-width="1"/>
      <text x="322" y="24" fill="#8E92A8" font-family="'Inter', sans-serif" font-size="10">EFISIENSI</text>
      <text x="322" y="48" fill="#10B981" font-family="'Inter', sans-serif" font-size="18" font-weight="700">+34%</text>
    </g>

    <text x="28" y="260" fill="#9DA2B8" font-family="'Inter', sans-serif" font-size="11">Semua sistem terhubung: musik pemutar siap dan kasir aktif.</text>

    <!-- Bottom prompt input bar -->
    <rect x="0" y="326" width="504" height="48" rx="12" fill="#181A27" stroke="#31344B" stroke-width="1"/>
    <text x="20" y="356" fill="#696D85" font-family="'Inter', sans-serif" font-size="12">Ketik perintah atau tanyakan apapun pada NEXUS AI...</text>
    <rect x="444" y="334" width="48" height="32" rx="8" fill="url(#accent)"/>
    <path d="M464 345 L472 350 L464 355 Z" fill="#FFFFFF"/>
  </g>
</svg>
